name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Retrieval, safety, answer and faithfulness evals run only when the repo has an OPENAI_API_KEY secret.
      # Costs about one cent per run with gpt-4o-mini.
      - name: Evals (quality gate)
        if: ${{ env.OPENAI_API_KEY != '' }}
        run: touch .env.local && npm run eval -- --answers
